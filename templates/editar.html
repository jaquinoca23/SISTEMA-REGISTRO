<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar - Registro de Huéspedes</title>
    <link rel="icon" href="/static/images/a4.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-900 flex items-center justify-center py-10"
    style="background-image: url('/static/images/hy.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">

    <div class="w-full max-w-6xl px-4 sm:px-6 lg:px-8">
        <div class="overflow-hidden rounded-3xl shadow-xl shadow-slate-200/70"
            style="background: linear-gradient(180deg, rgba(240,249,255,0.95) 0%, rgba(224,240,255,0.95) 50%, rgba(249,252,255,0.95) 100%);">

            <!-- Header -->
            <div class="border-b border-slate-200 px-6 py-6 sm:px-8">
                <div class="flex flex-col items-center gap-4 text-center sm:flex-row sm:justify-center sm:items-center">
                    <div class="flex items-center gap-4">
                        <img src="/static/images/sol.png" alt="Sol" class="h-14 w-14 rounded-2xl border border-slate-200 bg-slate-50 p-2 shadow-sm" />
                        <div>
                            <h1 class="text-3xl font-semibold tracking-tight text-slate-900">Editar Huésped</h1>
                            <p class="mt-2 text-sm text-slate-600">Busca por nombre o apellido para editar o eliminar un registro.</p>
                        </div>
                    </div>
                </div>
                <div class="mt-6 flex justify-center">
                    <div class="inline-flex rounded-full bg-slate-100 p-1 shadow-sm">
                        <a href="/login" class="rounded-full px-5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-900">LOGIN</a>
                        <a href="/registro" class="ml-1 rounded-full px-5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-900">REGISTRO</a>
                        <a href="/reportes" class="ml-1 rounded-full px-5 py-2 text-sm font-semibold text-slate-600 transition hover:text-slate-900">REPORTE</a>
                        <a href="/editar" class="ml-1 rounded-full bg-white px-5 py-2 text-sm font-semibold text-slate-900 shadow-sm">EDITAR</a>
                    </div>
                </div>
            </div>

            <div class="space-y-6 px-6 py-8 sm:px-8">

                <!-- Buscador -->
                <div class="rounded-3xl border border-slate-200 bg-slate-50 p-6 shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-900">Buscar huésped</h2>
                    <div class="mt-4 flex flex-wrap gap-3 items-end">
                        <div class="flex-1 min-w-[200px] max-w-sm">
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nombre o apellido</label>
                            <input id="input-buscar" type="text" placeholder="Ej: Carlos o Ramirez"
                                class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <button id="btn-buscar" class="rounded-3xl bg-sky-600 px-6 py-2.5 text-sm font-semibold text-white hover:bg-sky-700 transition-colors">Buscar</button>
                        <button id="btn-limpiar-buscar" class="rounded-3xl border border-slate-300 bg-white px-6 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors">Limpiar</button>
                    </div>
                    <p id="msg-busqueda" class="mt-3 text-sm text-slate-500 hidden"></p>
                </div>

                <!-- Resultados búsqueda -->
                <div id="resultados-busqueda" class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm hidden">
                    <h2 class="text-base font-semibold text-slate-900 mb-4">Resultados encontrados</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-slate-200 text-sm">
                            <thead class="bg-slate-50">
                                <tr>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Documento</th>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Nombres</th>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Apellidos</th>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Ciudad</th>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Ingreso</th>
                                    <th class="px-4 py-3 text-left font-medium text-slate-600">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-busqueda" class="divide-y divide-slate-200 bg-white"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Formulario editar -->
                <div id="modal-editar" class="hidden rounded-3xl border border-sky-200 bg-sky-50 p-6 shadow-sm">
                    <h2 class="text-lg font-semibold text-slate-900 mb-1">✏️ Editando registro</h2>
                    <p id="subtitle-editar" class="text-sm text-slate-500 mb-5"></p>
                    <input type="hidden" id="edit-id" />
                    <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Tipo de documento</label>
                            <select id="edit-tipo_documento" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                                <option value="dni">DNI</option>
                                <option value="pasaporte">Pasaporte</option>
                            </select>
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Número de documento</label>
                            <input id="edit-numero_documento" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nombres</label>
                            <input id="edit-nombres" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Apellidos</label>
                            <input id="edit-apellidos" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Edad</label>
                            <input id="edit-edad" type="number" min="0" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Fecha de nacimiento</label>
                            <input id="edit-fecha_nacimiento" type="date" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Sexo</label>
                            <select id="edit-sexo" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200">
                                <option value="masculino">Masculino</option>
                                <option value="femenino">Femenino</option>
                            </select>
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Nacionalidad</label>
                            <input id="edit-nacionalidad" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Ciudad</label>
                            <input id="edit-ciudad" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Fecha de ingreso</label>
                            <input id="edit-fecha_ingreso" type="date" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Fecha de salida</label>
                            <input id="edit-fecha_salida" type="date" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                        <div>
                            <label class="mb-1.5 block text-sm font-medium text-slate-700">Motivo del viaje</label>
                            <input id="edit-motivo_viaje" type="text" class="w-full rounded-2xl border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-200" />
                        </div>
                    </div>
                    <div class="mt-5 flex gap-3 justify-end">
                        <button id="btn-cancelar-editar" class="rounded-2xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-100 transition-colors">Cancelar</button>
                        <button id="btn-guardar-editar" class="rounded-2xl bg-sky-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-sky-700 transition-colors">Guardar cambios</button>
                    </div>
                    <p id="msg-editar" class="mt-3 text-sm hidden"></p>
                </div>

            </div>
        </div>
    </div>

    <script src="/static/js/editar.js"></script>
</body>
</html>
